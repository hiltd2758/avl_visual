<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVL Tree Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Header with inline controls -->
        <header class="header">
            <div class="header-container">
                <h1 class="app-title">AVL Tree</h1>
                
                <div class="controls">
                    <div class="input-wrapper">
                        <input 
                            type="number" 
                            id="nodeValue" 
                            class="node-input" 
                            placeholder="Nhập giá trị"
                            min="0"
                            max="999"
                        >
                    </div>
                    
                    <button class="btn btn-primary" onclick="addNode()">Thêm</button>
                    <button class="btn btn-secondary" onclick="deleteNode()">Xóa</button>
                    <button class="btn btn-secondary" onclick="searchNode()">Tìm</button>
                    <button class="btn btn-tertiary" onclick="resetTree()">Xóa cây</button>
                    
                    <div class="divider"></div>
                    
                    <button class="btn btn-ghost" onclick="togglePanel()">
                        <span id="panelToggleText">Hiện bảng điều khiển</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main content area -->
        <main class="main">
            <!-- Tree canvas -->
            <div class="canvas-area">
                <div class="tree-info">
                    <span id="nodeCount">0 nút</span>
                    <span class="separator">•</span>
                    <span id="treeHeight">Chiều cao 0</span>
                </div>
                
                <div id="treeContainer" class="tree-canvas"></div>
                
                <div class="empty-state" id="emptyState">
                    <p>Bắt đầu bằng cách thêm một nút</p>
                </div>
            </div>

            <!-- Collapsible side panel -->
            <aside class="panel" id="sidePanel">
                <div class="panel-content">
                    <div class="panel-section">
                        <h3 class="panel-heading">Duyệt cây</h3>
                        <div class="button-group">
                            <button class="btn-minimal" onclick="inOrder()">In-order</button>
                            <button class="btn-minimal" onclick="preOrderTraversal()">Pre-order</button>
                            <button class="btn-minimal" onclick="postOrderTraversal()">Post-order</button>
                        </div>
                    </div>

                    <div class="panel-section">
                        <h3 class="panel-heading">Tốc độ</h3>
                        <div class="speed-control">
                            <input 
                                type="range" 
                                id="speedSlider" 
                                class="slider" 
                                min="300" 
                                max="2700" 
                                step="300" 
                                value="1500"
                                oninput="setAnimationSpeed(this.value)"
                            >
                            <span id="speedLabel" class="speed-label">1.5x</span>
                        </div>
                    </div>

                    <div class="panel-section">
                        <h3 class="panel-heading">Lịch sử</h3>
                        <div id="logArea" class="log-area">
                            <div class="log-entry">Chào mừng đến với AVL Tree Visualizer</div>
                        </div>
                    </div>

                    <div class="panel-section">
                        <h3 class="panel-heading">Chú thích</h3>
                        <div class="legend">
                            <div class="legend-row">
                                <div class="legend-circle default"></div>
                                <span>Nút thường</span>
                            </div>
                            <div class="legend-row">
                                <div class="legend-circle active"></div>
                                <span>Đang xử lý</span>
                            </div>
                            <div class="legend-row">
                                <div class="legend-circle search"></div>
                                <span>Tìm kiếm</span>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
